<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="0950e6943305dfb6837010a3106435ebdcff3609" />
<meta name="robots" content="index, follow">
<title>모의투자 - 국내주식·미국주식·코인</title>
<meta name="description" content="실시간 국내주식·미국주식·코인 시세로 가상 자금 1천만원부터 시작하는 모의투자 시뮬레이터. 실제 돈이 들지 않는 연습용 투자 서비스입니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="모의투자">
<meta property="og:url" content="https://paper.tradesmrt.com/">
<meta property="og:title" content="모의투자 - 국내주식·미국주식·코인 실시간 시세로 연습하는 가상 투자">
<meta property="og:description" content="실시간 국내주식·미국주식·코인 시세로 가상 자금 1천만원부터 시작하는 모의투자 시뮬레이터. 실제 돈이 들지 않는 연습용 투자 서비스입니다.">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 로그인/회원가입 화면 -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:20px;">📈 모의투자</div>
    <div class="tabs">
      <button class="tab active" id="loginTabBtn" data-mode="login">로그인</button>
      <button class="tab" id="signupTabBtn" data-mode="signup">회원가입</button>
    </div>
    <div class="modal-field" style="margin-top:18px;">
      <label for="authUsername">아이디</label>
      <input type="text" id="authUsername" placeholder="영문/숫자 3~20자" autocomplete="username">
    </div>
    <div class="modal-field">
      <label for="authPassword">비밀번호</label>
      <input type="password" id="authPassword" placeholder="6자 이상" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="authSubmitBtn">로그인</button>
    <p class="modal-error" id="authError"></p>
  </div>
</div>

<!-- 메인 앱 -->
<div id="appScreen" style="display:none;">

<header class="topbar">
  <div class="wrap topbar-inner">
    <button type="button" class="brand brand-btn" id="brandHome">📈 모의투자</button>
    <div class="topbar-right">
      <span class="muted" id="whoami"></span>
      <button class="btn-ghost" id="resetBtn">계좌 초기화</button>
      <button class="btn-ghost" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="wrap">
    <nav class="tabs main-tabs" id="mainNav">
      <button class="tab active" data-view="account">내 계좌</button>
      <button class="tab" data-view="ranking">🏆 랭킹</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div id="accountView">
    <section class="hero-card">
      <div class="hero-left">
        <div class="hero-label">총 평가자산</div>
        <div class="hero-value" id="totalValue">-</div>
        <div class="hero-change" id="totalChange">-</div>
      </div>
      <div class="hero-right">
        <div class="stat">
          <div class="stat-label">보유 현금</div>
          <div class="stat-value" id="cashValue">-</div>
        </div>
        <div class="stat">
          <div class="stat-label">투자 원금</div>
          <div class="stat-value" id="initialValue">-</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>내 보유 종목</h2>
      <div id="holdingsList" class="holdings-list">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>

    <section class="panel">
      <h2>둘러보기</h2>
      <div class="tabs" id="discoverTabs">
        <button class="tab active" data-type="kr_stock">🇰🇷 국내주식</button>
        <button class="tab" data-type="us_stock">🇺🇸 미국주식</button>
        <button class="tab" data-type="crypto">🪙 코인</button>
      </div>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="종목명 또는 티커 검색 (예: 삼성전자, AAPL, bitcoin)">
      </div>
      <div id="discoverGrid" class="discover-grid">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>

    <section class="panel" id="pendingOrdersPanel" style="display:none">
      <h2>미체결 지정가 주문</h2>
      <div class="scroll">
        <table id="pendingOrdersTable"><tbody><tr><td class="muted">불러오는 중...</td></tr></tbody></table>
      </div>
    </section>

    <section class="panel">
      <h2>거래 내역</h2>
      <div class="scroll">
        <table id="txTable"><tbody><tr><td class="muted">불러오는 중...</td></tr></tbody></table>
      </div>
    </section>
  </div>

  <div id="rankingView" style="display:none;">
    <section class="panel">
      <h2>🏆 수익률 랭킹</h2>
      <p class="muted" style="margin-top:-10px;">모든 참가자가 1천만원으로 시작합니다. 수익률(%) 기준 순위입니다.</p>
      <div class="scroll">
        <table id="rankTable"><tbody><tr><td class="muted">불러오는 중...</td></tr></tbody></table>
      </div>
    </section>
  </div>

  <div id="detailView" style="display:none;">
    <button class="back-link" id="detailBack">← 목록으로</button>

    <section class="detail-header">
      <div>
        <div class="detail-name" id="detailName">-</div>
        <div class="detail-symbol muted" id="detailSymbol">-</div>
      </div>
      <div class="detail-price-block">
        <div class="detail-price" id="detailPrice">-</div>
        <div class="detail-change" id="detailChange">-</div>
      </div>
    </section>

    <div class="detail-layout">
      <div class="detail-chart-col">
        <div class="chart-range" id="detailChartRange">
          <button class="range-btn" data-interval="1m">1분</button>
          <button class="range-btn" data-interval="3m">3분</button>
          <button class="range-btn active" data-interval="5m">5분</button>
          <button class="range-btn" data-interval="15m">15분</button>
          <button class="range-btn" data-interval="30m">30분</button>
          <button class="range-btn" data-interval="60m">1시간</button>
          <button class="range-btn" data-interval="1d">일봉</button>
        </div>
        <div class="chart-wrap chart-wrap-lg">
          <div class="chart-ohlc" id="chartOHLC"></div>
          <canvas id="detailChartCanvas"></canvas>
          <p class="muted chart-empty" id="detailChartEmpty" style="display:none;">차트 데이터를 불러올 수 없습니다.</p>
        </div>

        <section class="panel">
          <h2>내 보유 종목</h2>
          <div id="detailHoldingsList" class="holdings-list">
            <p class="muted">보유한 종목이 없습니다.</p>
          </div>
        </section>
      </div>

      <div class="detail-trade-col">
        <div class="panel trade-panel">
          <div class="quote-stats" id="quoteStats">
            <div class="qs-item"><span class="muted">고가</span><span id="statDayHigh">-</span></div>
            <div class="qs-item"><span class="muted">저가</span><span id="statDayLow">-</span></div>
            <div class="qs-item"><span class="muted">전일종가</span><span id="statPrevClose">-</span></div>
            <div class="qs-item"><span class="muted">거래량</span><span id="statVolume">-</span></div>
            <div class="qs-item"><span class="muted">52주최고</span><span id="statWeek52High">-</span></div>
            <div class="qs-item"><span class="muted">52주최저</span><span id="statWeek52Low">-</span></div>
          </div>

          <div class="side-toggle">
            <button class="side-btn buy active" data-side="buy">매수</button>
            <button class="side-btn sell" data-side="sell">매도</button>
          </div>

          <div class="order-type-toggle" id="orderTypeToggle">
            <button class="order-type-btn active" data-type="market">시장가</button>
            <button class="order-type-btn" data-type="limit">지정가</button>
          </div>

          <div class="modal-field" id="limitPriceRow" style="display:none">
            <label for="limitPriceInput">지정가</label>
            <input type="number" id="limitPriceInput" min="0" step="any">
          </div>

          <div class="modal-field">
            <label for="detailQtyInput">수량</label>
            <div class="qty-input-row">
              <input type="number" id="detailQtyInput" min="0" step="any" value="1">
              <button type="button" class="qty-btn" id="qtyMinBtn">최소</button>
              <button type="button" class="qty-btn" id="qtyMaxBtn">최대</button>
            </div>
          </div>
          <div class="qty-pct-row" id="qtyPctRow">
            <button type="button" class="qty-pct-btn" data-pct="25">25%</button>
            <button type="button" class="qty-pct-btn" data-pct="50">50%</button>
            <button type="button" class="qty-pct-btn" data-pct="75">75%</button>
            <button type="button" class="qty-pct-btn" data-pct="100">100%</button>
          </div>
          <div class="modal-field" id="detailOwnedRow" style="display:none">
            <span class="muted">보유 수량</span>
            <span id="detailOwnedQty">0</span>
          </div>
          <div class="modal-total-row">
            <span>예상 금액</span>
            <span id="detailEstTotal">-</span>
          </div>

          <button class="btn-primary" id="detailSubmitBtn">주문 실행</button>
          <p class="modal-error" id="detailError"></p>
        </div>

        <div class="panel" id="detailPendingPanel" style="display:none">
          <h2>대기 중인 지정가 주문</h2>
          <div id="detailPendingList" class="holdings-list"></div>
        </div>
      </div>
    </div>
  </div>

</main>
</div>

<script src="/static/js/chart.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
